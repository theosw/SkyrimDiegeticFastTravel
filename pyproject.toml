[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diegetic-travel"
version = "0.1.0"
description = "Generated, hazard-aware travel networks for Skyrim SE"
requires-python = ">=3.10"
license = {text = "LicenseRef-Proprietary-Until-Selected"}
authors = [{name = "Theo"}]

[project.scripts]
diegetic-travel = "diegetic_travel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

