; Diegetic Fast Travel pricing and estimate settings.
; This file is read once when Skyrim starts. Restart the game after editing it.
; Invalid or missing values retain the safe defaults shown here.

[Carriage]
HoursPerMapUnit=10.0
FarePerMapUnit=1600.0
MinimumFare=100
FareStep=50

[Wizard]
FarePerTrip=250

[Ferries]
; When enabled, untouched tiers follow CFTO's live GlobalVariables.
; A non-negative override always takes priority. Use -1 for no override.
; When disabled without an override, audited CFTO defaults are used:
; local=30, regional=50, extra=100.
UseCFTOFares=true
LocalFareOverride=-1
RegionalFareOverride=-1
ExtraFareOverride=-1

[Display]
ShowEstimatedHours=true
MarkHoursAsApproximate=true
